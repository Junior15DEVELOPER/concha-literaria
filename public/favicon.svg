<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="shellGrad" x1="10" y1="90" x2="90" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B3224"/>
      <stop offset="50%" stop-color="#BA4E36"/>
      <stop offset="100%" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3C363"/>
      <stop offset="100%" stop-color="#D49438"/>
    </linearGradient>
  </defs>
  
  <!-- Outer organic shell base (scallop curves) -->
  <path d="M50 88 C32 88 14 74 12 50 C10 32 24 16 38 12 C44 10 50 16 50 22 C50 16 56 10 62 12 C76 16 90 32 88 50 C86 74 68 88 50 88 Z" fill="url(#shellGrad)" />
  
  <!-- Shell ridges / book spread outer wings -->
  <path d="M50 82 C38 80 22 68 20 48 C18 36 28 24 38 20 C42 18 48 24 48 34" stroke="#FFF0E5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M50 82 C62 80 78 68 80 48 C82 36 72 24 62 20 C58 18 52 24 52 34" stroke="#FFF0E5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Open Book Pages in the Center -->
  <!-- Left Page -->
  <path d="M50 76 C42 70 30 72 24 68 C22 56 25 40 28 32 C35 34 44 38 50 44 Z" fill="#FDFBF7" stroke="#BA4E36" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M47 48 C41 44 34 42 29 40" stroke="#D9A87D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M47 56 C41 52 34 50 28 48" stroke="#D9A87D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M47 64 C42 60 36 58 30 56" stroke="#D9A87D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Page -->
  <path d="M50 76 C58 70 70 72 76 68 C78 56 75 40 72 32 C65 34 56 38 50 44 Z" fill="#FDFBF7" stroke="#BA4E36" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M53 48 C59 44 66 42 71 40" stroke="#D9A87D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M53 56 C59 52 66 50 72 48" stroke="#D9A87D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M53 64 C58 60 64 58 70 56" stroke="#D9A87D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center Spine / Pearl Sparkle -->
  <line x1="50" y1="42" x2="50" y2="77" stroke="#BA4E36" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="30" r="4.5" fill="url(#goldGrad)" />
  <circle cx="51.5" cy="28.5" r="1.5" fill="#FFFFFF" />
</svg>